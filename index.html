<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>La Brasa Urbana - Burgers & Grill | Menú Digital</title>
  <meta name="description" content="Pide en línea tus Smash Burgers artesanales al carbón, boneless crujientes y papas cargadas directo a tu WhatsApp." />

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- FontAwesome 6 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
          },
          boxShadow: {
            'card': '0 10px 30px -5px rgba(15, 23, 42, 0.06), 0 4px 12px -2px rgba(15, 23, 42, 0.04)',
            'floating': '0 20px 40px -10px rgba(15, 23, 42, 0.45)',
          }
        }
      }
    };
  </script>

  <style>
    [x-cloak] {
      display: none !important;
    }
    /* Ocultar scrollbar manteniendo funcionalidad táctil y de arrastre */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Animación sutil para cambios en el contador */
    @keyframes popScale {
      0% { transform: scale(1); }
      50% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }
    .animate-pop {
      animation: popScale 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
  </style>

  <!-- Lógica y Configuración de la App -->
  <script src="app.js" defer></script>
  <!-- Alpine.js v3 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.7/dist/cdn.min.js" defer></script>
</head>

<body
  x-data="menuApp()"
  class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-amber-500 selection:text-white min-h-screen pb-32"
>
  <!-- ==================================================================== -->
  <!-- HEADER OSCURO PREMIUM (Mobile-First)                                 -->
  <!-- ==================================================================== -->
  <header class="relative bg-slate-900 text-white overflow-hidden">
    <!-- Imagen de fondo difuminada con overlay oscuro gradual -->
    <div class="absolute inset-0 z-0">
      <img
        :src="config.bannerUrl"
        :alt="config.nombre"
        class="w-full h-full object-cover object-center scale-110 blur-sm opacity-35"
      />
      <div class="absolute inset-0 bg-gradient-to-b from-slate-900/75 via-slate-900/85 to-slate-900"></div>
    </div>

    <!-- Contenido del Header -->
    <div class="relative z-10 max-w-2xl mx-auto px-4 pt-6 pb-6">
      <!-- Barra superior: Insignia pulsante de estado y botón rápido de info/WhatsApp -->
      <div class="flex items-center justify-between gap-2 mb-5">
        <!-- Insignia verde pulsante "Abierto ahora • Envío 30 min" -->
        <div class="inline-flex items-center gap-2.5 bg-emerald-500/15 border border-emerald-400/30 backdrop-blur-md px-3.5 py-1.5 rounded-full">
          <span class="relative flex h-2.5 w-2.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-400"></span>
          </span>
          <span class="text-xs font-semibold tracking-wide text-emerald-300" x-text="config.textoEstado">
            Abierto ahora • Envío 30 min
          </span>
        </div>

        <!-- Costo de envío pill -->
        <div class="inline-flex items-center gap-1.5 bg-white/10 backdrop-blur-md border border-white/10 px-3 py-1.5 rounded-full text-xs font-medium text-slate-200">
          <i class="fa-solid fa-motorcycle text-amber-400"></i>
          <span>Envío <strong class="text-white" x-text="formatearPrecio(config.costoEnvio)">$35</strong></span>
        </div>
      </div>

      <!-- Identidad del Restaurante: Logo Circular + Título + Eslogan -->
      <div class="flex items-center gap-4 mb-5">
        <div class="relative shrink-0">
          <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full p-1 bg-gradient-to-tr from-amber-500 via-orange-500 to-yellow-400 shadow-xl">
            <img
              :src="config.logoUrl"
              :alt="config.nombre"
              class="w-full h-full object-cover rounded-full border-2 border-slate-900"
            />
          </div>
          <span
            class="absolute -bottom-1 -right-1 bg-amber-500 text-slate-950 text-[10px] font-extrabold px-2 py-0.5 rounded-full shadow-md uppercase tracking-wider"
          >
            <i class="fa-solid fa-fire-flame-curved mr-0.5"></i> Top
          </span>
        </div>

        <div class="min-w-0 flex-1">
          <h1
            class="text-xl sm:text-2xl font-extrabold tracking-tight text-white leading-snug"
            x-text="config.nombre"
          >
            La Brasa Urbana - Burgers & Grill
          </h1>
          <p
            class="text-xs sm:text-sm text-slate-300 mt-1 line-clamp-2 leading-relaxed"
            x-text="config.eslogan"
          ></p>

          <!-- Metadatos rápidos (Horario y Ubicación) -->
          <div class="flex flex-wrap items-center gap-x-4 gap-y-1 mt-2.5 text-[11px] text-slate-400">
            <span class="inline-flex items-center gap-1.5">
              <i class="fa-regular fa-clock text-amber-400"></i>
              <span x-text="config.horarios"></span>
            </span>
            <span class="inline-flex items-center gap-1.5 truncate max-w-full">
              <i class="fa-solid fa-location-dot text-amber-400"></i>
              <span class="truncate" x-text="config.direccion"></span>
            </span>
          </div>
        </div>
      </div>

      <!-- Buscador en Tiempo Real -->
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
          <i class="fa-solid fa-magnifying-glass text-sm"></i>
        </div>
        <input
          type="search"
          x-model="busqueda"
          placeholder="Buscar hamburguesas, boneless, papas, bebidas..."
          aria-label="Buscar platillos en el menú"
          class="w-full pl-11 pr-10 py-3.5 bg-slate-800/90 hover:bg-slate-800 focus:bg-slate-800 text-white placeholder-slate-400 text-sm rounded-2xl border border-slate-700/80 focus:border-amber-500 focus:ring-2 focus:ring-amber-500/25 focus:outline-none transition-all duration-200 shadow-inner"
        />
        <!-- Botón limpiar búsqueda -->
        <button
          x-cloak
          x-show="busqueda.length > 0"
          @click="busqueda = ''"
          type="button"
          aria-label="Limpiar búsqueda"
          class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-white transition-colors"
        >
          <span class="w-6 h-6 rounded-full bg-slate-700 flex items-center justify-center text-xs">
            <i class="fa-solid fa-xmark"></i>
          </span>
        </button>
      </div>
    </div>
  </header>

  <!-- ==================================================================== -->
  <!-- BARRA HORIZONTAL DESLIZABLE DE CATEGORÍAS (Sticky & Sin Scrollbar)   -->
  <!-- ==================================================================== -->
  <nav
    aria-label="Categorías del menú"
    class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200/80 shadow-sm"
  >
    <div class="max-w-2xl mx-auto px-4 py-3">
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar scroll-smooth">
        <template x-for="categoria in categorias" :key="categoria">
          <button
            type="button"
            @click="categoriaActiva = categoria"
            :class="categoriaActiva === categoria
              ? 'bg-slate-900 text-white shadow-md shadow-slate-900/15 scale-[1.02]'
              : 'bg-slate-100 text-slate-600 hover:bg-slate-200/80 hover:text-slate-900'"
            class="shrink-0 inline-flex items-center gap-2 px-4 py-2 rounded-full text-xs sm:text-sm font-bold transition-all duration-200 active:scale-95 select-none"
          >
            <!-- Icono contextual por categoría -->
            <i
              class="text-xs"
              :class="{
                'fa-solid fa-border-all text-amber-400': categoria === 'Todo',
                'fa-solid fa-burger text-amber-500': categoria === 'Hamburguesas',
                'fa-solid fa-drumstick-bite text-orange-500': categoria === 'Boneless & Alitas',
                'fa-solid fa-fire-burner text-amber-500': categoria === 'Papas & Extras',
                'fa-solid fa-glass-water text-sky-400': categoria === 'Bebidas'
              }"
            ></i>
            <span x-text="categoria"></span>
            <span
              class="text-[11px] px-1.5 py-0.2 rounded-full font-semibold transition-colors"
              :class="categoriaActiva === categoria
                ? 'bg-white/20 text-white'
                : 'bg-slate-200/90 text-slate-500'"
              x-text="contarPorCategoria(categoria)"
            ></span>
          </button>
        </template>
      </div>
    </div>
  </nav>

  <!-- ==================================================================== -->
  <!-- CATÁLOGO DE PRODUCTOS                                                -->
  <!-- ==================================================================== -->
  <main class="max-w-2xl mx-auto px-4 pt-5">
    <!-- Encabezado de sección y contador de resultados -->
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-2">
        <h2 class="text-base sm:text-lg font-extrabold text-slate-900" x-text="categoriaActiva === 'Todo' ? 'Nuestro Menú Especial' : categoriaActiva"></h2>
        <span
          x-cloak
          x-show="busqueda.trim().length > 0"
          class="text-xs font-medium bg-amber-100 text-amber-800 px-2.5 py-0.5 rounded-full"
        >
          Filtrando: "<span x-text="busqueda"></span>"
        </span>
      </div>
      <span class="text-xs font-semibold text-slate-400">
        <span x-text="productosFiltrados.length"></span> platillos
      </span>
    </div>

    <!-- Estado vacío cuando la búsqueda no arroja resultados -->
    <div
      x-cloak
      x-show="productosFiltrados.length === 0"
      x-transition.opacity
      class="bg-white rounded-3xl border border-slate-200/80 p-8 text-center my-6 shadow-card"
    >
      <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center text-2xl">
        <i class="fa-solid fa-utensils"></i>
      </div>
      <h3 class="text-base font-bold text-slate-900 mb-1">No encontramos ese antojo</h3>
      <p class="text-xs sm:text-sm text-slate-500 mb-4 max-w-xs mx-auto">
        No hay platillos que coincidan con "<span class="font-semibold text-slate-700" x-text="busqueda"></span>" en esta categoría.
      </p>
      <button
        type="button"
        @click="busqueda = ''; categoriaActiva = 'Todo'"
        class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-bold hover:bg-slate-800 transition-colors"
      >
        <i class="fa-solid fa-rotate-left"></i>
        Ver todo el menú
      </button>
    </div>

    <!-- Lista / Grid de Tarjetas de Producto -->
    <div class="grid grid-cols-1 gap-4">
      <template x-for="producto in productosFiltrados" :key="producto.id">
        <article
          :class="obtenerCantidad(producto.id) > 0
            ? 'ring-2 ring-amber-500/80 bg-amber-50/10'
            : 'border border-slate-200/80 bg-white'"
          class="group relative rounded-3xl p-3.5 sm:p-4 shadow-card hover:shadow-lg transition-all duration-300 flex gap-3.5 sm:gap-4 items-stretch"
        >
          <!-- Imagen del Producto -->
          <div class="relative w-28 h-28 sm:w-32 sm:h-32 shrink-0 rounded-2xl overflow-hidden bg-slate-100">
            <img
              :src="producto.imagen"
              :alt="producto.nombre"
              loading="lazy"
              class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
            />
            <!-- Gradiente sutil en la base de la foto -->
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/50 via-transparent to-transparent"></div>

            <!-- Etiqueta / Badge del producto -->
            <template x-if="producto.etiqueta">
              <span
                class="absolute top-2 left-2 bg-slate-900/85 backdrop-blur-md text-amber-400 text-[10px] font-extrabold px-2 py-0.5 rounded-lg shadow-sm tracking-wide uppercase"
                x-text="producto.etiqueta"
              ></span>
            </template>

            <!-- Badge flotante con cantidad seleccionada sobre la foto -->
            <div
              x-cloak
              x-show="obtenerCantidad(producto.id) > 0"
              x-transition:enter="transition ease-out duration-200"
              x-transition:enter-start="opacity-0 scale-50"
              x-transition:enter-end="opacity-100 scale-100"
              class="absolute bottom-2 right-2 bg-amber-500 text-slate-950 font-extrabold text-xs w-6 h-6 rounded-full flex items-center justify-center shadow-md"
              :class="ultimoProductoModificado === producto.id ? 'animate-pop' : ''"
              x-text="obtenerCantidad(producto.id)"
            ></div>
          </div>

          <!-- Información y Controles Reactivos (+ / -) -->
          <div class="flex-1 min-w-0 flex flex-col justify-between">
            <div>
              <!-- Categoría pequeña superior -->
              <span
                class="text-[10px] font-bold uppercase tracking-wider text-amber-600 block mb-0.5"
                x-text="producto.categoria"
              ></span>

              <!-- Nombre del Platillo -->
              <h3
                class="text-sm sm:text-base font-extrabold text-slate-900 leading-snug group-hover:text-amber-600 transition-colors"
                x-text="producto.nombre"
              ></h3>

              <!-- Descripción antojable -->
              <p
                class="text-xs text-slate-500 mt-1 line-clamp-2 sm:line-clamp-3 leading-relaxed"
                x-text="producto.descripcion"
              ></p>
            </div>

            <!-- Pie de tarjeta: Precio en MXN y Controles (+ / -) -->
            <div class="flex items-center justify-between gap-2 mt-3 pt-2 border-t border-slate-100">
              <div>
                <span class="text-base sm:text-lg font-extrabold text-slate-900" x-text="formatearPrecio(producto.precio)"></span>
                <span class="text-[11px] font-semibold text-slate-400 ml-0.5">MXN</span>
              </div>

              <!-- Controles Reactivos (+ / -) con animación suave -->
              <div class="flex items-center">
                <div
                  class="inline-flex items-center bg-slate-100 rounded-2xl p-1 border border-slate-200/70 transition-all duration-200"
                  :class="obtenerCantidad(producto.id) > 0 ? 'bg-amber-50 border-amber-300/80 shadow-sm' : ''"
                >
                  <!-- Botón Decrementar (-) -->
                  <button
                    type="button"
                    @click="decrementar(producto.id)"
                    :disabled="obtenerCantidad(producto.id) === 0"
                    :aria-label="'Quitar uno de ' + producto.nombre"
                    :class="obtenerCantidad(producto.id) > 0
                      ? 'bg-white text-slate-800 hover:bg-red-50 hover:text-red-600 shadow-sm active:scale-90 cursor-pointer'
                      : 'text-slate-300 cursor-not-allowed'"
                    class="w-8 h-8 rounded-xl flex items-center justify-center text-xs font-bold transition-all duration-150"
                  >
                    <i class="fa-solid fa-minus"></i>
                  </button>

                  <!-- Cantidad actual -->
                  <span
                    class="w-8 text-center text-xs sm:text-sm font-extrabold select-none transition-transform duration-200"
                    :class="[
                      obtenerCantidad(producto.id) > 0 ? 'text-slate-900' : 'text-slate-400',
                      ultimoProductoModificado === producto.id ? 'animate-pop text-amber-600' : ''
                    ]"
                    x-text="obtenerCantidad(producto.id)"
                  ></span>

                  <!-- Botón Incrementar (+) -->
                  <button
                    type="button"
                    @click="incrementar(producto.id)"
                    :aria-label="'Agregar uno de ' + producto.nombre"
                    class="w-8 h-8 rounded-xl bg-gradient-to-br from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-white shadow-sm shadow-orange-500/30 flex items-center justify-center text-xs font-bold active:scale-90 transition-all duration-150"
                  >
                    <i class="fa-solid fa-plus"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </article>
      </template>
    </div>
  </main>

  <!-- ==================================================================== -->
  <!-- BARRA FLOTANTE INFERIOR (Sticky / Fixed cuando hay productos)        -->
  <!-- ==================================================================== -->
  <div
    x-cloak
    x-show="totalArticulos > 0"
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0 translate-y-12 scale-95"
    x-transition:enter-end="opacity-100 translate-y-0 scale-100"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100 translate-y-0 scale-100"
    x-transition:leave-end="opacity-0 translate-y-10 scale-95"
    class="fixed bottom-0 inset-x-0 z-40 p-3 sm:p-4 pointer-events-none"
  >
    <div class="max-w-2xl mx-auto pointer-events-auto">
      <div
        :class="animarCarrito ? 'scale-[1.015]' : 'scale-100'"
        class="bg-slate-900/95 backdrop-blur-xl border border-slate-700/80 text-white rounded-3xl p-3 sm:p-3.5 shadow-floating flex items-center justify-between gap-3 transition-transform duration-200"
      >
        <!-- Resumen de artículos y subtotal en MXN -->
        <div class="flex items-center gap-3 pl-1.5 min-w-0">
          <!-- Icono de bolsa con badge reactivo -->
          <div class="relative w-11 h-11 rounded-2xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center text-amber-400 shrink-0">
            <i class="fa-solid fa-bag-shopping text-lg"></i>
            <span
              :class="animarCarrito ? 'animate-pop' : ''"
              class="absolute -top-1.5 -right-1.5 min-w-[22px] h-[22px] px-1 rounded-full bg-amber-500 text-slate-950 font-extrabold text-xs flex items-center justify-center shadow"
              x-text="totalArticulos"
            ></span>
          </div>

          <div class="min-w-0">
            <div class="flex items-center gap-1.5 text-xs text-slate-300 font-medium">
              <span x-text="totalArticulos === 1 ? '1 artículo' : totalArticulos + ' artículos'"></span>
              <span>•</span>
              <span class="text-emerald-400 font-semibold">Subtotal</span>
            </div>
            <div class="flex items-baseline gap-1">
              <span
                class="text-lg sm:text-xl font-extrabold text-white tracking-tight"
                x-text="formatearPrecio(subtotalCarrito)"
              ></span>
              <span class="text-xs font-semibold text-slate-400" x-text="config.moneda">MXN</span>
            </div>
          </div>
        </div>

        <!-- Botón llamativo en degradado ámbar/naranja "Ver mi pedido" -->
        <button
          type="button"
          @click="abrirPedido()"
          class="shrink-0 inline-flex items-center gap-2.5 bg-gradient-to-r from-amber-500 via-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-slate-950 font-extrabold text-xs sm:text-sm px-5 py-3.5 rounded-2xl shadow-lg shadow-orange-500/25 active:scale-95 transition-all duration-150"
        >
          <span>Ver mi pedido</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
